[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aristotle"
version = "0.1.0"
description = "Telegram bot for the eRepublik browser game (port of Socrates)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
aristotle = "aristotle.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aristotle"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
